name: Android – بناء ونشر التحديث

# يشتغل تلقائياً عند تعديل كود التطبيق، أو يدوياً من تبويب Actions.
# تعديل remote/config.json لا يشغّله (لأنه يصل للتطبيق مباشرة بدون بناء).
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: 'ملاحظات التحديث (تظهر للمستخدم)'
        required: false
        default: ''
      force:
        description: 'تحديث إلزامي؟'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::لا يوجد KEYSTORE_BASE64 في Secrets – بدون توقيع ثابت لن تُقبل التحديثات فوق النسخة القديمة"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.p12
          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: حساب رقم الإصدار
        id: ver
        run: |
          BUILD=$(( ${{ github.run_number }} + 1 ))
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$BUILD" >> "$GITHUB_OUTPUT"

      - name: بناء APK
        run: |
          flutter build apk --release \
            --build-number=${{ steps.ver.outputs.build }} \
            --build-name=${{ steps.ver.outputs.name }}
          cp build/app/outputs/flutter-apk/app-release.apk todo-live.apk
          echo "SHA=$(sha256sum todo-live.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: نشر Release على GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES="${INPUT_NOTES:-$COMMIT_MSG}"
          NOTES="${NOTES:-تحسينات وإصلاحات}"
          printf '%s' "$NOTES" > notes.txt
          gh release create "v${{ steps.ver.outputs.name }}" todo-live.apk \
            --title "الإصدار ${{ steps.ver.outputs.name }}" \
            --notes-file notes.txt

      - name: تحديث remote/version.json (هذا ما يجعل التطبيقات تكتشف التحديث)
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git pull --rebase origin main
          python3 tool/update_version.py \
            --build "${{ steps.ver.outputs.build }}" \
            --name "${{ steps.ver.outputs.name }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.name }}/todo-live.apk" \
            --sha "$SHA" \
            --notes-file notes.txt \
            --force "${FORCE:-false}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/version.json
          git commit -m "release ${{ steps.ver.outputs.name }} [skip ci]"
          git push origin HEAD:main
